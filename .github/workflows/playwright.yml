
name: Playwright Tests

on:
  push:
    branches: [main, master, feature/playwright-ci]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/4
        env:
          CI: 'true'
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Check blob report files
        if: always()
        run: |
          echo "Checking blob-report directory..."
          if [ -d blob-report ]; then
            find blob-report -type f -print
          else
            echo "blob-report directory does not exist"
          fi

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  merge-reports:
    name: Merge Playwright reports
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result != 'cancelled'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Check downloaded blob reports
        run: |
          echo "Downloaded blob report files:"
          find all-blob-reports -type f -print

          if ! find all-blob-reports -type f | grep -q .; then
            echo "ERROR: No blob report files were downloaded."
            exit 1
          fi

      - name: Merge HTML and JUnit reports
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload merged JUnit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: junit-report
          path: reports/junit-merged.xml
          if-no-files-found: ignore
          retention-days: 14
